name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        # N'installe que ce qui est nécessaire pour les tests (pas streamlit, supabase…
        # qui sont stubbés dans conftest.py).
        run: |
          pip install --upgrade pip
          pip install polars pytest pytest-mock ruff

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Coverage check (src/logic/)
        run: |
          pip install pytest-cov
          pytest tests/unit/ \
            --cov=src/logic \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q
